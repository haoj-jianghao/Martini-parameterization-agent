# Python environment for python_command (helpers, cgbuild.py, stage-4 bonded terms).
# Versions as tested; the reference index was built with RDKit 2025.09.6.
# opls-ff-gen, MOPAC and xTB go in their own environment (see README).
name: martini-agent
channels:
  - conda-forge
dependencies:
  - python=3.12
  - rdkit=2025.09.6
  - numpy=2.5
  - scipy=1.18
  - openpyxl
  - matplotlib
  - pyyaml
  - poppler
