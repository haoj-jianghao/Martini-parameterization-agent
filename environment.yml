# Environment for python_command: helpers, cgbuild.py, stage-4 bonded terms and the OPLS engine opls-ff-lite.
# Versions as tested; the reference index was built with RDKit 2025.09.6.
#   conda env create -f environment.yml && conda activate martini-agent
#   python -m pip install --no-deps vendor/opls_ff_lite-0.1.0-py3-none-any.whl
name: martini-agent
channels:
  - conda-forge
dependencies:
  - python=3.12
  - rdkit=2025.09.6
  - numpy=2.5
  - scipy=1.18
  - openpyxl
  - matplotlib
  - pyyaml
  - poppler
  - mopac=23.2.5        # AM1 for the CM1A charges (opls-ff-lite)
  - pip
