# Environment for python_command: helpers, cgbuild.py and stage-4 bonded terms (no OPLS engine; the user supplies OPLS-AA topologies).
# Versions as tested; the reference index was built with RDKit 2025.09.6.
#   conda env create -f environment.yml && conda activate martini-agent
name: martini-agent
channels:
  - conda-forge
dependencies:
  - python=3.12
  - rdkit=2025.09.6
  - numpy=2.5
  - scipy=1.18
  - openpyxl
  - matplotlib
  - pyyaml
  - poppler
  - pip
